<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Sentiment Pulse — Analisis Sentimen Berita Crypto Real-Time</title>
  <meta name="description" content="Dashboard analisis sentimen berita cryptocurrency secara real-time menggunakan AI. Pantau sentimen pasar Bitcoin, Ethereum, dan Solana dari sumber berita terpercaya." />
  <meta name="theme-color" content="#0A0B0E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Crypto Sentiment Pulse</h1>
        <span class="live-indicator">
          <span class="pulse-dot" aria-hidden="true"></span>
          Live Feed: CoinDesk (25 Berita)
        </span>
      </div>
      <button id="btn-refresh" class="btn-refresh" type="button" aria-label="Refresh feed">
        <svg class="icon-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1.5 8a6.5 6.5 0 0 1 11.3-4.4M14.5 8a6.5 6.5 0 0 1-11.3 4.4"/>
          <polyline points="1.5 3.5 1.5 7 5 7"/>
          <polyline points="14.5 12.5 14.5 9 11 9"/>
        </svg>
        Refresh
      </button>
    </header>

    <!-- Market Pulse Barometer -->
    <section id="market-pulse-bar" class="market-pulse-bar" aria-label="Barometer Sentimen Pasar">
      <div class="pulse-bar-header">
        <div class="pulse-status-wrap">
          <span class="pulse-eyebrow">BAROMETER PASAR</span>
          <span id="market-status-text" class="market-status-text">Memuat analisis sentimen...</span>
        </div>
        <div class="pulse-meta-badge">
          <span id="total-articles-count" class="meta-count">0 Berita Dianalisis</span>
        </div>
      </div>

      <!-- Segmented Visual Bar -->
      <div class="pulse-progress-track" role="progressbar" aria-label="Rasio Sentimen Pasar">
        <div id="bar-bullish" class="progress-segment seg-bullish" style="width: 33.3%"></div>
        <div id="bar-neutral" class="progress-segment seg-neutral" style="width: 33.3%"></div>
        <div id="bar-bearish" class="progress-segment seg-bearish" style="width: 33.4%"></div>
      </div>

      <!-- Legend & Stats -->
      <div class="pulse-legend">
        <div class="legend-item">
          <span class="legend-dot dot-bullish"></span>
          <span class="legend-name">Bullish</span>
          <strong id="pct-bullish" class="legend-pct">0%</strong>
        </div>
        <div class="legend-item">
          <span class="legend-dot dot-neutral"></span>
          <span class="legend-name">Neutral</span>
          <strong id="pct-neutral" class="legend-pct">0%</strong>
        </div>
        <div class="legend-item">
          <span class="legend-dot dot-bearish"></span>
          <span class="legend-name">Bearish</span>
          <strong id="pct-bearish" class="legend-pct">0%</strong>
        </div>
      </div>
    </section>

    <!-- Filter Bar -->
    <nav class="filter-bar" aria-label="Filter berita berdasarkan koin">
      <button class="filter-btn active" data-filter="Semua" type="button">Semua</button>
      <button class="filter-btn filter-btc" data-filter="BTC" type="button">Bitcoin <span class="ticker">$BTC</span></button>
      <button class="filter-btn filter-eth" data-filter="ETH" type="button">Ethereum <span class="ticker">$ETH</span></button>
      <button class="filter-btn filter-sol" data-filter="SOL" type="button">Solana <span class="ticker">$SOL</span></button>
    </nav>

    <!-- Card Grid -->
    <main id="card-grid" class="card-grid" aria-live="polite">
      <!-- Cards injected by script.js -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      Crypto Sentiment Pulse &middot; Powered by Gemini AI &amp; CoinDesk RSS Feed
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
